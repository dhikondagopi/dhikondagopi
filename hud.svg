<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="850" height="300">
  <defs>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bar-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="bar-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B026FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#B026FF" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#05050A"/>

  <!-- Left Stats Panel: PROGRESS BARS -->
  <g transform="translate(50, 40)" font-family="monospace">
    <text x="0" y="0" fill="#00F0FF" font-size="14" font-weight="bold">> LOAD_COMPETENCY_MODULES</text>
    
    <!-- MERN Stack -->
    <text x="0" y="40" fill="#FFFFFF" font-size="12">MERN STACK (React, Node, Mongo)</text>
    <rect x="0" y="50" width="300" height="8" fill="#1A1A24" rx="4"/>
    <rect x="0" y="50" width="0" height="8" fill="url(#bar-cyan)" rx="4" filter="url(#glow-cyan)">
      <animate attributeName="width" from="0" to="270" dur="2s" fill="freeze" calcMode="spline" keySplines="0.1 0.8 0.1 1" keyTimes="0;1"/>
    </rect>
    <text x="315" y="58" fill="#00F0FF" font-size="11">90%</text>

    <!-- Cyber Security -->
    <text x="0" y="90" fill="#FFFFFF" font-size="12">CYBER SECURITY / THREAT INTEL</text>
    <rect x="0" y="100" width="300" height="8" fill="#1A1A24" rx="4"/>
    <rect x="0" y="100" width="0" height="8" fill="url(#bar-purple)" rx="4" filter="url(#glow-purple)">
      <animate attributeName="width" from="0" to="255" dur="2.2s" fill="freeze" calcMode="spline" keySplines="0.1 0.8 0.1 1" keyTimes="0;1"/>
    </rect>
    <text x="315" y="108" fill="#B026FF" font-size="11">85%</text>

    <!-- AI & Machine Learning -->
    <text x="0" y="140" fill="#FFFFFF" font-size="12">ARTIFICIAL INTELLIGENCE &amp; ML</text>
    <rect x="0" y="150" width="300" height="8" fill="#1A1A24" rx="4"/>
    <rect x="0" y="150" width="0" height="8" fill="url(#bar-cyan)" rx="4" filter="url(#glow-cyan)">
      <animate attributeName="width" from="0" to="225" dur="2.5s" fill="freeze" calcMode="spline" keySplines="0.1 0.8 0.1 1" keyTimes="0;1"/>
    </rect>
    <text x="315" y="158" fill="#00F0FF" font-size="11">75%</text>

    <!-- Full Stack / Architecture -->
    <text x="0" y="190" fill="#FFFFFF" font-size="12">SYSTEM DESIGN &amp; DATABASE</text>
    <rect x="0" y="200" width="300" height="8" fill="#1A1A24" rx="4"/>
    <rect x="0" y="200" width="0" height="8" fill="url(#bar-purple)" rx="4" filter="url(#glow-purple)">
      <animate attributeName="width" from="0" to="240" dur="2.8s" fill="freeze" calcMode="spline" keySplines="0.1 0.8 0.1 1" keyTimes="0;1"/>
    </rect>
    <text x="315" y="208" fill="#B026FF" font-size="11">80%</text>
  </g>

  <!-- Right Side: AI Core UI -->
  <g transform="translate(650, 150)">
    <!-- Hexagonal Grid Base -->
    <polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50" fill="none" stroke="#1A1A24" stroke-width="2"/>
    
    <!-- Rotating Rings -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="10 20 40 10" filter="url(#glow-cyan)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite" />
    </circle>
    
    <circle cx="0" cy="0" r="50" fill="none" stroke="#B026FF" stroke-width="2" stroke-dasharray="15 30" filter="url(#glow-purple)">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite" />
    </circle>

    <!-- Inner Core Polygon -->
    <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="none" stroke="#00F0FF" stroke-width="2" filter="url(#glow-cyan)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </polygon>

    <!-- Pulsing Center Orb -->
    <circle cx="0" cy="0" r="10" fill="#00F0FF" filter="url(#glow-cyan)">
      <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Crosshairs -->
    <path d="M -110 0 L -80 0 M 80 0 L 110 0 M 0 -110 L 0 -80 M 0 80 L 0 110" stroke="#00F0FF" stroke-width="1" opacity="0.5"/>
    <text x="-32" y="-120" font-family="monospace" font-size="10" fill="#00F0FF">AI_ENGINE</text>
  </g>

  <!-- Framing Accents -->
  <path d="M 10 30 L 30 10 L 150 10" fill="none" stroke="#B026FF" stroke-width="2" opacity="0.6"/>
  <path d="M 840 270 L 820 290 L 700 290" fill="none" stroke="#00F0FF" stroke-width="2" opacity="0.6"/>
</svg>
