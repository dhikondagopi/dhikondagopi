
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400" width="850" height="400">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030305"/>
      <stop offset="100%" stop-color="#0a0a12"/>
    </linearGradient>
    <filter id="neon-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neon-purple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="cyber-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00F0FF" stroke-width="0.5" stroke-opacity="0.1">
        <animate attributeName="stroke-opacity" values="0.1;0.25;0.1" dur="4s" repeatCount="indefinite"/>
      </path>
    </pattern>
    <clipPath id="reveal-text">
      <rect x="0" y="0" width="0" height="400">
        <animate attributeName="width" from="0" to="850" dur="2.5s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.1 0.8 0.1 1"/>
      </rect>
    </clipPath>
    <clipPath id="reveal-text-delayed">
      <rect x="0" y="0" width="0" height="400">
        <animate attributeName="width" from="0" to="850" dur="2.5s" begin="1.5s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.1 0.8 0.1 1"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>
  
  <!-- Animated Grid -->
  <g transform="translate(0, 0)">
    <rect width="850" height="400" fill="url(#cyber-grid)"/>
    <animateTransform attributeName="transform" type="translate" from="0 -30" to="0 0" dur="6s" repeatCount="indefinite" />
  </g>

  <!-- Cyberpunk Borders -->
  <rect x="15" y="15" width="820" height="370" fill="none" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="20" y="20" width="810" height="360" fill="none" stroke="#B026FF" stroke-width="1" stroke-opacity="0.1" stroke-dasharray="10 5"/>
  
  <path d="M 10 40 L 10 10 L 40 10" fill="none" stroke="#00F0FF" stroke-width="3" filter="url(#neon-cyan)"/>
  <path d="M 840 40 L 840 10 L 810 10" fill="none" stroke="#00F0FF" stroke-width="3" filter="url(#neon-cyan)"/>
  <path d="M 10 360 L 10 390 L 40 390" fill="none" stroke="#00F0FF" stroke-width="3" filter="url(#neon-cyan)"/>
  <path d="M 840 360 L 840 390 L 810 390" fill="none" stroke="#00F0FF" stroke-width="3" filter="url(#neon-cyan)"/>

  <!-- Boot Sequence Logs -->
  <g font-family="monospace" font-size="13" fill="#00F0FF" opacity="0.8">
    <text x="45" y="60">> SYSTEM BOOT SEQUENCE INITIATED...</text>
    <text x="45" y="78">> KERNEL: AI_OS_v9.9.0 LOADED</text>
    <text x="45" y="96">> DECRYPTING USER PROFILE [██████████] 100%</text>
    <text x="45" y="114">> ESTABLISHING SECURE PROTOCOLS...</text>
    <text x="45" y="132">> ACCESS GRANTED.</text>
    <animate attributeName="opacity" values="0;1;1;1" keyTimes="0;0.1;0.9;1" dur="2s" fill="freeze"/>
  </g>

  <!-- Main Identity Text -->
  <g clip-path="url(#reveal-text-delayed)">
    <!-- Shadow / Glitch Effect -->
    <text x="47" y="220" font-family="sans-serif" font-weight="900" font-size="64" fill="#00F0FF" opacity="0.3">DHIKONDA GOPI</text>
    <text x="43" y="220" font-family="sans-serif" font-weight="900" font-size="64" fill="#B026FF" opacity="0.3">DHIKONDA GOPI</text>
    <!-- Core Text -->
    <text x="45" y="220" font-family="sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" letter-spacing="4" filter="url(#neon-cyan)">DHIKONDA GOPI</text>
  </g>

  <!-- Titles -->
  <g clip-path="url(#reveal-text-delayed)">
    <rect x="45" y="250" width="220" height="28" fill="#B026FF" opacity="0.15"/>
    <text x="55" y="269" font-family="monospace" font-weight="bold" font-size="14" fill="#B026FF" filter="url(#neon-purple)">FULL STACK DEVELOPER</text>

    <rect x="275" y="250" width="200" height="28" fill="#00F0FF" opacity="0.1"/>
    <text x="285" y="269" font-family="monospace" font-weight="bold" font-size="14" fill="#00F0FF" filter="url(#neon-cyan)">CYBER SECURITY PRO</text>
    
    <text x="45" y="320" font-family="monospace" font-size="13" fill="#8892B0">> DIRECTORY: ~/workspace/dhikonda-gopi</text>
    <text x="45" y="340" font-family="monospace" font-size="13" fill="#8892B0">> STATUS: ONLINE AND READY TO COMPILE_</text>
    
    <!-- Blinking Cursor -->
    <rect x="345" y="328" width="8" height="15" fill="#00F0FF">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Tech Geometric Decor right side -->
  <g transform="translate(600, 180)" fill="none" stroke-width="1.5">
    <!-- Spinning Rings -->
    <circle cx="100" cy="50" r="60" stroke="#00F0FF" stroke-opacity="0.2" stroke-dasharray="10 5"/>
    <circle cx="100" cy="50" r="70" stroke="#B026FF" stroke-opacity="0.4" stroke-dasharray="40 20">
      <animateTransform attributeName="transform" type="rotate" from="0 100 50" to="360 100 50" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="50" r="45" stroke="#00F0FF" stroke-opacity="0.6" stroke-dasharray="15 30">
      <animateTransform attributeName="transform" type="rotate" from="360 100 50" to="0 100 50" dur="8s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Data lines -->
    <path d="M 0 50 L 55 50 L 70 20 L 100 20" stroke="#00F0FF" stroke-opacity="0.8" filter="url(#neon-cyan)">
      <animate attributeName="stroke-dasharray" from="0 200" to="200 0" dur="3s" fill="freeze"/>
    </path>
    <path d="M 30 90 L 70 90 L 80 70 L 100 70" stroke="#B026FF" stroke-opacity="0.8" filter="url(#neon-purple)">
      <animate attributeName="stroke-dasharray" from="0 200" to="200 0" dur="4s" fill="freeze"/>
    </path>
    
    <!-- Glowing Orbs -->
    <circle cx="100" cy="20" r="3" fill="#00F0FF" filter="url(#neon-cyan)"/>
    <circle cx="100" cy="70" r="3" fill="#B026FF" filter="url(#neon-purple)"/>
    <circle cx="100" cy="50" r="4" fill="#FFFFFF">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
