
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="850" height="180">
  <defs>
    <filter id="glass-glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#08080E" rx="8"/>
  <rect x="1" y="1" width="848" height="178" fill="none" stroke="#1A1A24" stroke-width="1.5" rx="8"/>
  
  <!-- Neon Accent Edge -->
  <rect x="0" y="0" width="5" height="180" fill="#B026FF" filter="url(#glass-glow-purple)" rx="2"/>

  <!-- Title & Status -->
  <text x="35" y="45" font-family="monospace" font-size="24" fill="#FFFFFF" font-weight="bold">CafePOS (AI Powered)</text>
  
  <rect x="360" y="28" width="90" height="22" fill="#B026FF" fill-opacity="0.1" rx="4" stroke="#B026FF" stroke-width="1"/>
  <circle cx="372" cy="39" r="4" fill="#B026FF">
    <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="385" y="43" font-family="monospace" font-size="11" fill="#B026FF">DEPLOYED</text>

  <!-- Description -->
  <text x="35" y="75" font-family="sans-serif" font-size="14" fill="#8892B0">AI Powered Cafe Management Platform. End-to-end POS billing, QR menu integration,</text>
  <text x="35" y="95" font-family="sans-serif" font-size="14" fill="#8892B0">kitchen dashboard, employee tracking, and intelligent AI-generated analytics reports.</text>

  <!-- Features Grid -->
  <g font-family="monospace" font-size="12" fill="#FFFFFF" transform="translate(35, 125)">
    <circle cx="0" cy="-4" r="3" fill="#00F0FF"/>
    <text x="10" y="0">POS &amp; QR Menu</text>
    
    <circle cx="160" cy="-4" r="3" fill="#00F0FF"/>
    <text x="170" y="0">Kitchen Dashboard</text>
    
    <circle cx="350" cy="-4" r="3" fill="#00F0FF"/>
    <text x="360" y="0">AI Analytics &amp; Inv.</text>
  </g>

  <!-- Tech Stack Tags -->
  <g font-family="monospace" font-size="11" font-weight="bold" transform="translate(35, 155)">
    <text x="0" y="0" fill="#B026FF">[ REACT ]</text>
    <text x="80" y="0" fill="#B026FF">[ NODE.JS ]</text>
    <text x="170" y="0" fill="#B026FF">[ EXPRESS ]</text>
    <text x="260" y="0" fill="#B026FF">[ MONGODB ]</text>
    <text x="350" y="0" fill="#B026FF">[ AI INTEG. ]</text>
  </g>

  <!-- Action Button -->
  <rect x="680" y="70" width="140" height="40" fill="none" stroke="#B026FF" stroke-width="1.5" rx="4"/>
  <text x="700" y="94" font-family="monospace" font-size="12" fill="#B026FF">EXECUTE /VIEW</text>
  <path d="M 800 89 L 805 94 L 800 99" fill="none" stroke="#B026FF" stroke-width="2"/>

  <!-- Scanning Overlay -->
  <rect x="0" y="0" width="850" height="40" fill="url(#grad-scan-p)" opacity="0.05">
    <animate attributeName="y" from="-40" to="180" dur="4s" repeatCount="indefinite"/>
  </rect>
  <defs>
    <linearGradient id="grad-scan-p" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B026FF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#B026FF" stop-opacity="1"/>
    </linearGradient>
  </defs>
</svg>
