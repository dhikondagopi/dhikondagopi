
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="850" height="180">
  <defs>
    <filter id="glass-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#08080E" rx="8"/>
  <rect x="1" y="1" width="848" height="178" fill="none" stroke="#1A1A24" stroke-width="1.5" rx="8"/>
  
  <!-- Neon Accent Edge -->
  <rect x="0" y="0" width="5" height="180" fill="#00F0FF" filter="url(#glass-glow)" rx="2"/>

  <!-- Title & Status -->
  <text x="35" y="45" font-family="monospace" font-size="24" fill="#FFFFFF" font-weight="bold">AssetFlow Enterprise ERP</text>
  
  <rect x="420" y="28" width="90" height="22" fill="#00F0FF" fill-opacity="0.1" rx="4" stroke="#00F0FF" stroke-width="1"/>
  <circle cx="432" cy="39" r="4" fill="#00F0FF">
    <animate attributeName="opacity" values="1;0;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="445" y="43" font-family="monospace" font-size="11" fill="#00F0FF">ONLINE</text>

  <!-- Description -->
  <text x="35" y="75" font-family="sans-serif" font-size="14" fill="#8892B0">Enterprise Asset Management Platform. Comprehensive system for organizing,</text>
  <text x="35" y="95" font-family="sans-serif" font-size="14" fill="#8892B0">tracking, allocating, and auditing resources and maintenance workflows.</text>

  <!-- Features Grid -->
  <g font-family="monospace" font-size="12" fill="#FFFFFF" transform="translate(35, 125)">
    <circle cx="0" cy="-4" r="3" fill="#B026FF"/>
    <text x="10" y="0">Allocation &amp; Transfer</text>
    
    <circle cx="210" cy="-4" r="3" fill="#B026FF"/>
    <text x="220" y="0">Resource Booking</text>
    
    <circle cx="390" cy="-4" r="3" fill="#B026FF"/>
    <text x="400" y="0">Maintenance &amp; Audit</text>
  </g>

  <!-- Tech Stack Tags -->
  <g font-family="monospace" font-size="11" font-weight="bold" transform="translate(35, 155)">
    <text x="0" y="0" fill="#00F0FF">[ REACT ]</text>
    <text x="80" y="0" fill="#00F0FF">[ TYPESCRIPT ]</text>
    <text x="195" y="0" fill="#00F0FF">[ SUPABASE ]</text>
    <text x="295" y="0" fill="#00F0FF">[ TAILWIND ]</text>
    <text x="395" y="0" fill="#00F0FF">[ POSTGRESQL ]</text>
  </g>

  <!-- Action Button -->
  <rect x="680" y="70" width="140" height="40" fill="none" stroke="#00F0FF" stroke-width="1.5" rx="4"/>
  <text x="700" y="94" font-family="monospace" font-size="12" fill="#00F0FF">EXECUTE /VIEW</text>
  <path d="M 800 89 L 805 94 L 800 99" fill="none" stroke="#00F0FF" stroke-width="2"/>

  <!-- Scanning Overlay -->
  <rect x="0" y="0" width="850" height="40" fill="url(#grad-scan)" opacity="0.05">
    <animate attributeName="y" from="-40" to="180" dur="3s" repeatCount="indefinite"/>
  </rect>
  <defs>
    <linearGradient id="grad-scan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="1"/>
    </linearGradient>
  </defs>
</svg>
